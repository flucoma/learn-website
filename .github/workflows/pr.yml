name: tests

on:
    pull_request:
        branches: ['*']

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                node-version: 26

            - uses: oven-sh/setup-bun@v2 

            - name: Install Dependencies
              run: bun i

            - name: Run Tests
              run: bun run test

name: tests

on:
    pull_request:
        branches: ['*']

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                node-version: 26

            - name: install node / pm
              run: npm install -g @nubjs/nub

            - name: Install Dependencies
              run: nub i

            - name: Run Tests
              run: pnpm run test
